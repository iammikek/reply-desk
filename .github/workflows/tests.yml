name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, sqlite, pdo_sqlite
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Prepare the environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Generate the application key
        run: php artisan key:generate

      - name: Discover packages
        run: composer dump-autoload --no-interaction

      - name: Publish Filament assets
        run: php artisan filament:assets --no-interaction

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run tests
        run: composer test

  # After this workflow succeeds on master, Railway Wait for CI deploys a new
  # filesystem to web + cron from the same commit (see docs/deploy.md).
  # Railway's own build also runs `npm run build` into that image.
  railway:
    name: Railway will deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - name: Gate passed
        run: |
          echo "Tests and asset build passed on master."
          echo "Railway Wait for CI will build (including Vite assets) and deploy web + cron."
